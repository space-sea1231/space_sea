<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Logo自动生成工具</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }
        input[type="file"] {
            display: none;
        }
        .preview {
            margin: 20px 0;
            text-align: center;
        }
        .preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        .icon-item img {
            display: block;
            margin: 0 auto 10px;
            border: 1px solid #ddd;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin: 10px;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .download-area {
            margin-top: 30px;
            padding: 20px;
            background: #f0fff4;
            border-radius: 10px;
            border: 2px solid #9ae6b4;
        }
        .instructions {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 网页智能点击器 - Logo生成工具</h1>
        
        <div class="instructions">
            <strong>📋 使用说明：</strong><br>
            1. 上传您的logo图片（PNG、JPG都可以）<br>
            2. 自动生成16、32、48、128像素的图标<br>
            3. 下载生成的图标文件<br>
            4. 放到扩展的icons文件夹中
        </div>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 48px; margin-bottom: 15px;">📁</div>
            <div style="font-size: 18px; font-weight: 500; margin-bottom: 10px;">点击上传logo图片</div>
            <div style="color: #666; font-size: 14px;">或拖拽图片到这里</div>
            <div style="color: #999; font-size: 12px; margin-top: 10px;">支持 PNG、JPG、GIF 格式</div>
        </div>
        
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="preview" id="preview" style="display: none;">
            <h3>原始图片预览：</h3>
            <img id="originalImage">
        </div>
        
        <div style="text-align: center;">
            <button id="generateBtn" onclick="generateIcons()" disabled>🎨 生成所有尺寸图标</button>
        </div>
        
        <div class="icons-grid" id="iconsGrid" style="display: none;">
            <div class="icon-item">
                <img id="icon16" width="16" height="16">
                <div>16×16px</div>
                <button onclick="downloadIcon('icon16', 'icon16.png')">下载</button>
            </div>
            <div class="icon-item">
                <img id="icon32" width="32" height="32">
                <div>32×32px</div>
                <button onclick="downloadIcon('icon32', 'icon32.png')">下载</button>
            </div>
            <div class="icon-item">
                <img id="icon48" width="48" height="48">
                <div>48×48px</div>
                <button onclick="downloadIcon('icon48', 'icon48.png')">下载</button>
            </div>
            <div class="icon-item">
                <img id="icon128" width="128" height="128">
                <div>128×128px</div>
                <button onclick="downloadIcon('icon128', 'icon128.png')">下载</button>
            </div>
        </div>
        
        <div class="download-area" id="downloadArea" style="display: none;">
            <h3>✅ 图标生成完成！</h3>
            <p>请将下载的图标文件放到以下文件夹：</p>
            <code style="background: #f1f1f1; padding: 5px; border-radius: 4px;">
                D:\A-Project\click\browser-extension\icons\
            </code>
            <br><br>
            <button onclick="downloadAll()">📦 一键下载所有图标</button>
        </div>
    </div>

    <script>
        let originalImage = null;
        
        // 文件上传处理
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        
        // 拖拽上传
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件！');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    document.getElementById('originalImage').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('generateBtn').disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function generateIcons() {
            if (!originalImage) return;
            
            const sizes = [16, 32, 48, 128];
            
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 启用图像平滑
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                // 绘制缩放后的图像
                ctx.drawImage(originalImage, 0, 0, size, size);
                
                // 设置到对应的img元素
                const iconImg = document.getElementById(`icon${size}`);
                iconImg.src = canvas.toDataURL('image/png');
            });
            
            document.getElementById('iconsGrid').style.display = 'grid';
            document.getElementById('downloadArea').style.display = 'block';
        }
        
        function downloadIcon(iconId, filename) {
            const img = document.getElementById(iconId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = img.src;
            link.click();
        }
        
        function downloadAll() {
            const sizes = [16, 32, 48, 128];
            sizes.forEach(size => {
                setTimeout(() => {
                    downloadIcon(`icon${size}`, `icon${size}.png`);
                }, size * 10); // 延迟下载避免浏览器阻止
            });
        }
    </script>
</body>
</html>
